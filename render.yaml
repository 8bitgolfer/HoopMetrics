services:
  - type: web
    name: hoopmetrics-ai
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: ALLOWED_ORIGIN
        value: https://8bitgolfer.github.io
      - key: MAX_DAILY_REQUESTS
        value: "300"
